<!-- HTML5 문서 선언 -->
<!DOCTYPE html>

<!-- 한국어 페이지 시작 -->
<html lang="ko">

<head>

  <!-- 문자 인코딩 설정 -->
  <meta charset="UTF-8">

  <!-- 모바일 화면 크기 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 브라우저 탭 제목 -->
  <title>가계부</title>

  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- 전체 내용을 감싸는 영역 -->
  <div class="container">

    <!-- 가계부 제목 -->
    <h1>나의 가계부</h1>

    <!-- 시작 금액 입력 영역 -->
    <div class="start-money">

      <!-- 시작 금액 안내 -->
      <label for="initialMoney">시작 금액</label>

      <!-- 시작 금액 입력창 -->
      <input type="number" id="initialMoney" placeholder="금액을 입력하세요">

      <!-- 시작 금액 저장 버튼 -->
      <button id="saveMoneyBtn">저장</button>

    </div>

    <!-- 지출 입력 영역 -->
    <div class="expense-form">

      <!-- 날짜 입력창 -->
      <input type="date" id="date">

      <!-- 사용 내용 입력창 -->
      <input type="text" id="content" placeholder="사용 내용">

      <!-- 사용 금액 입력창 -->
      <input type="number" id="amount" placeholder="사용 금액">

      <!-- 지출 추가 버튼 -->
      <button id="addBtn">추가</button>

    </div>

    <!-- 지출 내역 표 -->
    <table>

      <!-- 표 제목 영역 -->
      <thead>

        <!-- 제목 행 -->
        <tr>

          <!-- 날짜 제목 -->
          <th>날짜</th>

          <!-- 내용 제목 -->
          <th>내용</th>

          <!-- 사용한 돈 제목 -->
          <th>사용한 돈</th>

          <!-- 남은 돈 제목 -->
          <th>남은 돈</th>

        </tr>

      </thead>

      <!-- 지출 내역이 추가되는 영역 -->
      <tbody id="expenseList">

      </tbody>

    </table>

  </div>

  <!-- JavaScript 파일 연결 -->
  <script src="script.js"></script>

</body>

</html>
